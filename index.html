<html>
<head>
    <style>

           @keyframes m1 {

               from {

                   transform:  translateX(0);
                   font-size: 20px;
               }
               to {

                   transform:  translate(200px,200px);
                   font-size: 70px;

               }
           }
               h1{

                   animation: m1 3s  ease-in-out   infinite;
               }


    </style>



</head>

<body>
<h1 id="h1">hello</h1>
<button onclick="change()">change</button>

<script>
    function change() {
                let h1=document.getElementById('h1')
                h1.style.backgroundColor= 'green'

    }



</script>
       
</body>




</html>
